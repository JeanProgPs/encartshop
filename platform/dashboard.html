<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Platform Admin — Dashboard</title>
  <link rel="icon" type="image/png" href="/assets/favicon.png">
  
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/assets/output.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    .fade-in-up { animation: fadeInUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; transform: translateY(10px); }
    @keyframes fadeInUp { to { opacity: 1; transform: translateY(0); } }
    .hover-scale { transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.2s ease; }
    .hover-scale:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }
  </style>
</head>
<body data-page="dashboard" class="bg-bgPrimary text-textPrimary antialiased selection:bg-indigo-500 selection:text-white">

<div class="admin-layout flex min-h-screen">
  <aside class="sidebar" id="sidebar"></aside>

  <main class="main-content flex-1 ml-0 md:ml-[256px] flex flex-col min-h-screen transition-all duration-300">
    
    <header class="h-[64px] bg-cardBg/80 backdrop-blur-md border-b border-borderColor sticky top-0 z-50 px-4 md:px-8 flex items-center justify-between">
      <div class="flex items-center gap-4">
        <h2 class="text-sm font-bold text-indigo-500 tracking-wider uppercase">Platform Admin</h2>
      </div>
      <div class="flex items-center gap-3">
        <button class="w-9 h-9 flex items-center justify-center rounded-full hover:bg-bgPrimary transition-colors relative">
          <i data-lucide="bell" class="w-5 h-5 text-textSecondary"></i>
        </button>
      </div>
    </header>

    <div class="flex-1 p-4 md:p-8 flex flex-col gap-6 max-w-[1400px] w-full mx-auto">
      
      <!-- Platform Health Panel -->
      <div class="fade-in-up bg-cardBg border border-indigo-500/20 rounded-xl p-5 shadow-sm">
        <h3 class="text-base font-semibold text-textPrimary mb-4 flex items-center gap-2">
           <i data-lucide="activity" class="w-5 h-5 text-indigo-500"></i> Saúde da Plataforma
        </h3>
        <div id="health-grid" class="grid grid-cols-2 md:grid-cols-4 gap-4">
          <!-- Skeletons -->
          <div class="h-16 bg-bgPrimary rounded-lg animate-pulse"></div>
          <div class="h-16 bg-bgPrimary rounded-lg animate-pulse"></div>
          <div class="h-16 bg-bgPrimary rounded-lg animate-pulse"></div>
          <div class="h-16 bg-bgPrimary rounded-lg animate-pulse"></div>
        </div>
      </div>

      <!-- User Activity KPIs -->
      <h3 class="text-base font-semibold text-textPrimary fade-in-up mt-2" style="animation-delay: 0.1s;">Atividade de Usuários</h3>
      <div id="stats-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 fade-in-up" style="animation-delay: 0.1s;">
         <div class="h-24 bg-cardBg rounded-xl animate-pulse"></div>
         <div class="h-24 bg-cardBg rounded-xl animate-pulse"></div>
         <div class="h-24 bg-cardBg rounded-xl animate-pulse"></div>
         <div class="h-24 bg-cardBg rounded-xl animate-pulse"></div>
      </div>

      <!-- Content Metrics & Recent Clients -->
      <div class="grid grid-cols-1 xl:grid-cols-3 gap-6 fade-in-up" style="animation-delay: 0.2s;">
        
        <div class="xl:col-span-2 flex flex-col gap-4">
          <div class="flex items-center justify-between">
            <h3 class="text-base font-semibold text-textPrimary">Clientes Recentes</h3>
            <a href="/platform/clientes" class="text-sm font-medium text-indigo-500 hover:text-indigo-400 transition-colors flex items-center gap-1">
              Ver todos <i data-lucide="arrow-right" class="w-4 h-4"></i>
            </a>
          </div>
          
          <div class="bg-cardBg border border-borderColor rounded-xl overflow-hidden shadow-card">
            <div id="recent-clients-list" class="divide-y divide-borderColor">
               <div class="p-8 text-center text-sm text-textSecondary">Carregando clientes...</div>
            </div>
          </div>
        </div>

        <div class="flex flex-col gap-4">
          <h3 class="text-base font-semibold text-textPrimary">Métricas de Conteúdo</h3>
          <div id="content-metrics" class="bg-cardBg border border-borderColor rounded-xl p-5 flex flex-col gap-4">
             <div class="h-8 bg-bgPrimary rounded animate-pulse"></div>
             <div class="h-8 bg-bgPrimary rounded animate-pulse"></div>
             <div class="h-8 bg-bgPrimary rounded animate-pulse"></div>
          </div>
        </div>

      </div>
      
    </div>
  </main>
</div>

<div id="toast-container"></div>

<script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.9/dist/purify.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/core/supabase.js"></script>
<script src="/js/core/supabaseClient.js"></script>
<script src="/js/core/helpers.js"></script>
<script src="/js/auth/authService.js"></script>
<script src="/js/ui/components.js"></script>
<script src="/js/ui/render.js"></script>

<!-- Platform Scripts -->
<script src="/js/platform/platformGuard.js"></script>
<script src="/js/platform/platformCommon.js"></script>
<script src="/js/platform/platformAPI.js"></script>

<script>
  async function initDashboard() {
    try {
      const stats = await PlatformAPI.getStats();
      const recent = await PlatformAPI.getRecentClients();

      const d = stats.data;

      // Render Health
      const renderHealthCard = (label, value, color) => `
        <div class="flex flex-col gap-1 p-3 bg-bgPrimary rounded-lg border border-borderColor">
          <span class="text-xs font-semibold text-textSecondary uppercase tracking-wider">${label}</span>
          <span class="text-xl font-bold ${color}">${value}</span>
        </div>
      `;
      document.getElementById('health-grid').innerHTML = `
        ${renderHealthCard('Total Lojas', d.platformHealth.total, 'text-textPrimary')}
        ${renderHealthCard('Ativas', d.platformHealth.active, 'text-emerald-500')}
        ${renderHealthCard('Expiradas', d.platformHealth.expired, 'text-amber-500')}
        ${renderHealthCard('Suspensas', d.platformHealth.suspended, 'text-red-500')}
      `;

      // Render Activity KPIs
      const renderCard = (title, value, icon, colorClass) => `
        <div class="bg-cardBg border border-borderColor rounded-xl p-5 hover-scale group">
          <div class="flex items-center justify-between mb-3">
            <span class="text-sm font-medium text-textSecondary">${title}</span>
            <div class="w-8 h-8 rounded-full flex items-center justify-center ${colorClass} bg-opacity-10 group-hover:scale-110 transition-transform">
              <i data-lucide="${icon}" class="w-4 h-4 ${colorClass.replace('bg-','text-')}"></i>
            </div>
          </div>
          <div>
             <h4 class="text-2xl font-bold text-textPrimary tracking-tight">${value}</h4>
          </div>
        </div>`;
      
      document.getElementById('stats-grid').innerHTML = `
        ${renderCard('Total de Clientes', d.totalClients, 'users', 'bg-indigo-500')}
        ${renderCard('Clientes Ativos', d.activeClients, 'check-circle', 'bg-emerald-500')}
        ${renderCard('Em Risco', d.riskClients, 'alert-circle', 'bg-amber-500')}
        ${renderCard('Inativos', d.inactiveClients, 'x-circle', 'bg-red-500')}
      `;

      // Render Content Metrics
      const renderMetricRow = (label, value, icon) => `
        <div class="flex items-center justify-between py-2 border-b border-borderColor last:border-0">
          <div class="flex items-center gap-2 text-sm font-medium text-textSecondary">
            <i data-lucide="${icon}" class="w-4 h-4"></i> ${label}
          </div>
          <span class="font-bold text-textPrimary">${value}</span>
        </div>
      `;
      document.getElementById('content-metrics').innerHTML = `
        ${renderMetricRow('Novos (7d)', d.clients7d, 'user-plus')}
        ${renderMetricRow('Novos (30d)', d.clients30d, 'users')}
        ${renderMetricRow('Total Produtos', d.productsCount, 'package')}
        ${renderMetricRow('Total Pedidos', d.ordersCount, 'shopping-cart')}
        ${renderMetricRow('Total Promoções', d.promosCount, 'tag')}
        ${renderMetricRow('Lojas com Campanhas', d.storesWithCampaigns, 'megaphone')}
      `;

      // Render Recent Clients
      const recentList = document.getElementById('recent-clients-list');
      if (!recent.data || recent.data.length === 0) {
         recentList.innerHTML = `<div class="p-8 text-center text-sm text-textSecondary">Nenhum cliente encontrado.</div>`;
      } else {
         const fmtD = dStr => UIRender.fmtDateShort(dStr);
         const getActivityColor = (status) => {
           if(status === 'active') return 'bg-emerald-500';
           if(status === 'risk') return 'bg-amber-500';
           return 'bg-red-500';
         };

         recentList.innerHTML = recent.data.map(c => `
          <div class="px-5 py-4 flex flex-col sm:flex-row sm:items-center justify-between gap-3 hover:bg-bgPrimary/50 transition-colors">
            <div class="flex items-center gap-3">
              <div class="w-10 h-10 rounded-full bg-indigo-500/10 flex items-center justify-center flex-shrink-0 relative">
                <span class="text-xs font-bold text-indigo-600">${String(c.name).charAt(0).toUpperCase()}</span>
                <span class="absolute bottom-0 right-0 w-3 h-3 border-2 border-cardBg rounded-full ${getActivityColor(c.activity_status)}"></span>
              </div>
              <div>
                <h4 class="text-sm font-semibold text-textPrimary">${escapeHTML(c.name)}</h4>
                <p class="text-xs text-textSecondary mt-0.5">${escapeHTML(c.responsavel)} · Cadastro: ${fmtD(c.created_at)}</p>
              </div>
            </div>
            <div class="flex items-center gap-3">
              <span class="px-2 py-1 rounded text-[10px] font-bold uppercase tracking-wider bg-bgPrimary border border-borderColor text-textSecondary">
                ${c.plan}
              </span>
            </div>
          </div>
         `).join('');
      }

      setTimeout(() => lucide.createIcons(), 50);

    } catch (err) {
      console.error(err);
      showToast('Erro ao carregar dados do dashboard.', 'error');
    }
  }

  initDashboard();
</script>
</body>
</html>
